<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">How agentMonitor works</title>
  <desc id="d">Claude Code writes session transcripts to the .claude folder. agentMonitor only reads them, extracts the files, commands and permission decisions of every call, checks them against the boundary you set, and shows the result in a local web page. It writes only to its own var folder. The session judge is the one optional path that leaves the machine: on a click it starts Claude Code, which sends a session dump to the Anthropic API.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9fb3c8"/>
    </marker>
    <marker id="arrw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#e3b341"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #b8c4d4; }
      .lbl { font-size: 12px; fill: #7f93aa; letter-spacing: 1.5px; }
      .dim { fill: #7f93aa; }
      .hi { fill: #f0f4f8; }
      .warn { fill: #e3b341; }
      .bad { fill: #f85149; }
      .sm { font-size: 12px; }
      .box { fill: none; stroke: #2a3b52; stroke-width: 1; }
      .wire { stroke: #9fb3c8; stroke-width: 1.5; fill: none; }
      .opt { stroke: #e3b341; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="960" height="360" fill="#0f1b2d"/>

  <!-- Claude Code -->
  <g id="claude">
    <rect class="box" x="36.5" y="40.5" width="190" height="190"/>
    <rect x="48" y="32" width="112" height="16" fill="#0f1b2d"/>
    <text class="lbl" x="56" y="44">CLAUDE CODE</text>
    <text class="hi sm" x="52" y="86">projects/*.jsonl</text>
    <text class="dim sm" x="52" y="106">session transcripts</text>
    <text class="hi sm" x="52" y="144">hook events</text>
    <text class="dim sm" x="52" y="164">optional, you install</text>
    <text class="dim sm" x="52" y="212">agentMonitor never writes here</text>
  </g>

  <path class="wire" d="M226 98 H300" marker-end="url(#arr)"/>
  <path class="wire" d="M226 156 H262 V118 H300" marker-end="url(#arr)"/>
  <text class="dim sm" x="240" y="90">reads</text>

  <!-- agentMonitor -->
  <g id="monitor">
    <rect class="box" x="300.5" y="40.5" width="330" height="190"/>
    <rect x="312" y="32" width="116" height="16" fill="#0f1b2d"/>
    <text class="lbl" x="320" y="44">AGENTMONITOR</text>
    <text class="hi sm" x="320" y="78">parse</text>
    <text class="dim sm" x="420" y="78">files, commands, results</text>
    <text class="hi sm" x="320" y="106">boundary</text>
    <text class="dim sm" x="420" y="106">crossed or stopped calls</text>
    <text class="hi sm" x="320" y="134">permissions</text>
    <text class="dim sm" x="420" y="134">which rule asked or blocked</text>
    <text class="hi sm" x="320" y="162">aggregates</text>
    <text class="dim sm" x="420" y="162">outlive deleted transcripts</text>
    <text class="dim sm" x="320" y="212">PHP 8.4, 127.0.0.1 only</text>
  </g>

  <path class="wire" d="M630 135 H700" marker-end="url(#arr)"/>

  <!-- views -->
  <g id="views">
    <rect class="box" x="700.5" y="40.5" width="222" height="190"/>
    <rect x="712" y="32" width="68" height="16" fill="#0f1b2d"/>
    <text class="lbl" x="720" y="44">VIEWS</text>
    <text class="hi sm" x="720" y="80">Overview</text>
    <text class="dim sm" x="720" y="98">signals by axis</text>
    <text class="hi sm" x="720" y="130">Session tabs</text>
    <text class="dim sm" x="720" y="148">files · commands · approvals</text>
    <text class="hi sm" x="720" y="180">Assessment</text>
    <text class="dim sm" x="720" y="198">what to fix, and where</text>
  </g>

  <!-- var -->
  <g id="var">
    <rect class="box" x="300.5" y="268.5" width="330" height="56"/>
    <rect x="312" y="260" width="48" height="16" fill="#0f1b2d"/>
    <text class="lbl" x="320" y="272">VAR/</text>
    <text class="hi sm" x="320" y="304">the only place agentMonitor writes</text>
  </g>
  <path class="wire" d="M465 230 V268" marker-end="url(#arr)"/>

  <!-- judge -->
  <g id="judge">
    <rect class="box" x="700.5" y="268.5" width="222" height="56"/>
    <rect x="712" y="260" width="140" height="16" fill="#0f1b2d"/>
    <text class="lbl warn" x="720" y="272">JUDGE · ON CLICK</text>
    <text class="dim sm" x="720" y="304">claude -p → Anthropic API</text>
  </g>
  <path class="opt" d="M900 230 V268" marker-end="url(#arrw)"/>
  <text class="warn sm" x="888" y="254" text-anchor="end">session dump leaves the machine</text>

  <text class="dim sm" x="36" y="344">no other network traffic · file contents are never shown, only paths and commands</text>
</svg>
